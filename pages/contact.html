<!DOCTYPE html>

  <link rel="stylesheet" href="../CSS/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
  <header class="header">
    <nav>
      <a href="../index.html">Home</a>
      <a href="../pages/game-portfolio.html">Game Portfolio</a>
      <a href="../pages/program-portfolio.html">Program Portfolio</a>
      <a href="../pages/contact.html" aria-current="page">Contact</a>
    </nav>
  </header>
  <main>
    <section class="contact_container">
      <h1 class="page_title">Get in Touch</h1>
      <p>Have a game or project in mind? I'd be glad to hear about it. Just fill out the form below.</p>
      <p>Prefer to email directly? Click <a href="mailto:francois.popieul@gmail.com">here</a> to send me a message.</p>
      <form class="contact_form" action="https://formspree.io/f/xeagvnoo" method="POST">
        <label for="contact-name">Name</label>
        <input id="contact-name" name="name" type="text" autocomplete="name" required>

        <label for="contact-email">Email</label>
        <input id="contact-email" name="email" type="email" autocomplete="email" required>

        <label for="contact-project">Game/Project (optional)</label>
        <input id="contact-project" name="project" type="text">

        <label for="contact-message">Message</label>
        <textarea id="contact-message" name="message" rows="6" required></textarea>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>
  <footer class="footer">
    <section>
      <h3 class="bold center small_caps">Social Media</h3>
      <ul class="horizontal_container">
        <li>
          <a rel="noopener" href="https://www.linkedin.com/in/françois-popieul-8b07ab285" target="_blank"><img class="icon_small" src="../Images/LI-mark.svg" alt="LinkedIn Logo" /></a>
        </li>
        <li>
          <a rel="noopener" href="https://github.com/Francois-Popieul" target="_blank"><img class="icon_small" src="../Images/github-mark.svg" alt="GitHub Logo" /></a>
        </li>
        <li>
          <a rel="noopener" href="https://www.codecademy.com/profiles/Francois-Popieul" target="_blank"><img class="icon_small" src="../Images/CA-mark.svg" alt="Codecademy Logo" /></a>
        </li>
      </ul>
    </section>
  </footer>
